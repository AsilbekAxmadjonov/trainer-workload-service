spring:
  config:
    activate:
      on-profile: docker

  mongodb:
    uri: mongodb://mongodb:27017/workloaddb

  activemq:
    broker-url: tcp://activemq:61616
    user: admin
    password: admin

  jms:
    listener:
      auto-startup: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    hostname: workload-service

management:
  health:
    jms:
      enabled: true