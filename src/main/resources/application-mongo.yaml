spring:
  config:
    activate:
      on-profile: mongo

  mongodb:
    uri: mongodb://localhost:27017/workloaddb

  activemq:
    broker-url: vm://localhost?broker.persistent=false
  jms:
    listener:
      auto-startup: false


eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

